name: Arena 3D SET_VS real-pointer E2E

# Separate from the fast source/regression gate (materialize-clean-source.yml)
# because this needs real browser binaries and network access to install them.
# Proves the actual click -> ATK/DEF -> VS-zone -> next-phase sequence with
# genuine pointer input against a real running build, not source-string checks.

on:
  push:
    branches: [arena-clean-rebuild]
  pull_request:
    branches: [arena-clean-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-vs-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run real-pointer SET_VS E2E test
        run: npx playwright test

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
