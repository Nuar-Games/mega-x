name: Arena Visual QA

on:
  push:
    branches: [arena-clean-rebuild]
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build current branch
        run: npm run build
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start current branch preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/mega-x-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mega-x-preview.log
          exit 1
      - name: Prove guest Practice in the real 3D arena
        env:
          MEGAX_PREVIEW_URL: "http://127.0.0.1:4173/"
        run: |
          cat > arena-qa.mjs <<'EOF'
          import { chromium } from 'playwright'
          import fs from 'node:fs'

          const base=process.env.MEGAX_PREVIEW_URL
          const url=`${base}?arena=3d`
          const out='visual-qa'
          fs.mkdirSync(out,{recursive:true})
          const browser=await chromium.launch({headless:true})
          const records=[]

          async function enterPractice(page,label){
            const button=page.locator('#mx-main-practice-cta')
            await button.waitFor({state:'visible',timeout:15000})
            const box=await button.boundingBox()
            const pointerEvents=await button.evaluate(el=>getComputedStyle(el).pointerEvents)
            records.push(`[${label}] practiceCTA box=${JSON.stringify(box)} pointerEvents=${pointerEvents}`)
            if(!box||pointerEvents==='none')throw new Error('GUEST_PRACTICE_NOT_CLICKABLE')
            await button.click()
          }

          async function recordEntryState(page,label){
            const snapshot=await page.evaluate(()=>({
              url:location.href,
              rootText:(document.getElementById('root')?.textContent||'').replace(/\s+/g,' ').trim().slice(0,1200),
              htmlClass:document.documentElement.className,
              bodyClass:document.body.className,
              duelShells:document.querySelectorAll('.duel-shell').length,
              vsIntros:document.querySelectorAll('[class*="vs-intro"], [class*="vsintro"], .vs-intro').length,
              authText:Array.from(document.querySelectorAll('button,h1,h2,h3')).map(el=>(el.textContent||'').trim()).filter(Boolean).slice(0,30),
              guestId:localStorage.getItem('mega-x-practice-guest-id-v1'),
            }))
            records.push(`[${label}] postPractice=${JSON.stringify(snapshot)}`)
            await page.screenshot({path:`${out}/${label}-post-practice.png`,fullPage:false})
          }

          async function read3D(page){
            return {
              prompt:((await page.locator('.mx3d-prompt').textContent().catch(()=>''))||'').trim(),
              status:((await page.locator('.mx3d-status').textContent().catch(()=>''))||'').trim(),
              commands:await page.locator('.mx3d-command').allTextContents().catch(()=>[]),
              chooser:await page.locator('.mx3d-chooser').count(),
              canvas:await page.locator('.mx3d-canvas canvas').count(),
              root:await page.locator('[data-arena-3d-root="true"]').count(),
              phase:await page.locator('.mx3-canvas').getAttribute('data-arena-phase').catch(()=>null),
            }
          }

          async function clickCanonicalAction(page,label){
            const selectors=[
              '.mx3d-chooser .mx3d-choice:not([disabled])',
              '.mx3-local-hand [data-arena-card-action]:not([disabled])',
              '.mx3d-mobile-card:not([disabled])',
              '.mx3d-command:not([disabled])',
              '.mx3-phase-prompt button:not([disabled])',
              '.board-target-card:not([disabled])',
              '.target-effect:not([disabled])',
              '.discard-card-choice:not([disabled])',
              '.discard-confirm:not([disabled])',
              '.end-turn-confirm-panel button.confirm-yes:not([disabled])',
              '.choice-panel button:not([disabled])',
            ]
            for(const selector of selectors){
              const target=page.locator(selector).filter({hasNotText:/QUIT|SURRENDER|AUDIO|CLOSE/i}).first()
              if(await target.count()){
                const text=((await target.textContent())||'').replace(/\s+/g,' ').trim()
                records.push(`[${label}] action selector=${selector} text=${text}`)
                await target.evaluate(el=>el.click())
                return true
              }
            }
            return false
          }

          async function proveStateBridge(page,label){
            let changed=0
            let previous=await read3D(page)
            for(let step=0;step<24;step++){
              const clicked=await clickCanonicalAction(page,label)
              await page.waitForTimeout(clicked?900:1200)
              const next=await read3D(page)
              records.push(`[${label}] step=${step} state=${JSON.stringify(next)}`)
              if(JSON.stringify(next)!==JSON.stringify(previous)) changed++
              previous=next
              if(/GAME OVER|MENANG|VICTORY|DEFEAT/i.test(`${next.prompt} ${next.status}`)) break
            }
            records.push(`[${label}] stateChanges=${changed}`)
            if(changed<2)throw new Error(`THREE_D_STATE_BRIDGE_STALLED:${changed}`)
          }

          async function capture(label,viewport,interactive=false){
            const context=await browser.newContext({viewport,isMobile:viewport.width<600,hasTouch:viewport.width<600,deviceScaleFactor:1})
            const page=await context.newPage()
            const errors=[]
            page.on('console',msg=>{records.push(`[${label} console ${msg.type()}] ${msg.text()}`);if(msg.type()==='error')errors.push(msg.text())})
            page.on('pageerror',err=>{records.push(`[${label} pageerror] ${err.message}`);errors.push(err.message)})
            page.on('requestfailed',req=>records.push(`[${label} requestfailed] ${req.url()} :: ${req.failure()?.errorText||'unknown'}`))

            const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000})
            records.push(`[${label}] status=${response?.status()} viewport=${viewport.width}x${viewport.height}`)
            if(response?.status()!==200)throw new Error(`PREVIEW_HTTP_${response?.status()}`)

            await enterPractice(page,label)
            try{
              await page.waitForSelector('.duel-shell',{timeout:12000,state:'attached'})
            }catch(error){
              await recordEntryState(page,label)
              throw error
            }
            await page.waitForSelector('[data-arena-3d-root="true"]',{timeout:30000,state:'attached'})
            await page.waitForSelector('.mx3d-canvas canvas',{timeout:30000,state:'visible'})
            await page.waitForSelector('.mx3d-prompt',{timeout:30000,state:'visible'})
            await page.waitForTimeout(1800)

            const initial=await read3D(page)
            records.push(`[${label}] initial3D=${JSON.stringify(initial)}`)
            if(initial.root!==1||initial.canvas!==1)throw new Error('THREE_D_ARENA_NOT_MOUNTED')
            if(!initial.prompt)throw new Error('THREE_D_PROMPT_MISSING')

            const legacy=page.locator('.mx3-canvas')
            if(await legacy.count()){
              const opacity=await legacy.evaluate(el=>getComputedStyle(el).opacity)
              const pointer=await legacy.evaluate(el=>getComputedStyle(el).pointerEvents)
              records.push(`[${label}] legacy opacity=${opacity} pointerEvents=${pointer}`)
              if(pointer!=='none')throw new Error('LEGACY_ARENA_STILL_INTERACTIVE')
            }

            if(interactive)await proveStateBridge(page,label)

            await page.screenshot({path:`${out}/${label}-3d-practice.png`,fullPage:false})
            if(errors.length)throw new Error(`BROWSER_ERRORS:${errors.join(' | ')}`)
            await context.close()
          }

          let fatal=null
          try{
            await capture('portrait-412x915',{width:412,height:915})
            await capture('landscape-915x412',{width:915,height:412})
            await capture('desktop-1366x768',{width:1366,height:768},true)
            await capture('desktop-1920x1080',{width:1920,height:1080})
          }catch(error){
            fatal=error
            records.push(`[fatal] ${error?.stack||error}`)
          }finally{
            await browser.close()
            fs.writeFileSync(`${out}/report.txt`,records.join('\n\n'))
          }
          if(fatal)throw fatal
          EOF
          node arena-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-visual-qa
          path: visual-qa/
          retention-days: 3
