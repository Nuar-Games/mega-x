name: Arena Visual QA

on:
  push:
    branches: [arena-clean-rebuild]
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build current branch
        run: npm run build
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start current branch preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/mega-x-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mega-x-preview.log
          exit 1
      - name: Prove guest Practice and capture arena
        env:
          MEGAX_PREVIEW_URL: "http://127.0.0.1:4173/"
        run: |
          cat > arena-qa.mjs <<'EOF'
          import { chromium } from 'playwright'
          import fs from 'node:fs'
          const url=process.env.MEGAX_PREVIEW_URL
          const out='visual-qa'
          fs.mkdirSync(out,{recursive:true})
          const browser=await chromium.launch({headless:true})
          const records=[]

          async function enterPractice(page,label){
            await page.waitForTimeout(1800)
            const button=page.locator('#mx-main-practice-cta')
            await button.waitFor({state:'visible',timeout:15000})
            const text=(await button.innerText()).replace(/\s+/g,' ').trim()
            const pointerEvents=await button.evaluate(el=>getComputedStyle(el).pointerEvents)
            const box=await button.boundingBox()
            records.push(`[${label}] guestPractice=${text} pointerEvents=${pointerEvents} box=${JSON.stringify(box)}`)
            if(pointerEvents==='none'||!box) throw new Error('GUEST_PRACTICE_NOT_CLICKABLE')
            await button.click()
          }

          async function phaseState(page){
            const prompt=((await page.locator('.mx3-phase-prompt strong').textContent().catch(()=>''))||'').trim()
            const engine=await page.locator('.mx3-canvas').evaluate(el=>{
              const cls=[...el.classList].find(v=>v.startsWith('phase-'))
              return cls?cls.slice(6).toUpperCase():''
            }).catch(()=>'')
            return {prompt,engine}
          }

          async function snapshot(page){
            const phase=await phaseState(page)
            return {
              hand:await page.locator('.mx3-local-hand img').count(),
              prompt:phase.prompt,
              engine:phase.engine,
              deck:((await page.locator('.mx3-master-counter').textContent().catch(()=>''))||'').trim(),
              vs:await page.locator('.mx3-vs-left img,.mx3-vs-right img').count(),
              effects:await page.locator('.mx3-effects-left img,.mx3-effects-right img').count(),
              status:((await page.locator('.mx3-status').textContent().catch(()=>''))||'').trim(),
            }
          }

          function wideHandCenters(width,height,count){
            const w=Math.max(320,width),h=Math.max(480,height)
            const pad=Math.max(8,Math.min(w,h)*0.014)
            const handH=h*0.275
            const commandRail=Math.max(250,w*0.165)
            const playableW=w-pad*2-commandRail
            const region={x:pad,y:h-handH-pad,width:playableW,height:handH}
            const visible=Math.max(1,Math.min(count,8))
            const aspect=59/86
            const maxCardH=region.height*0.98
            const maxCardW=maxCardH*aspect
            const step=Math.min(maxCardW*0.66,region.width/Math.max(4,visible+0.5))
            const cardW=Math.min(maxCardW,Math.max(region.width*0.17,step/0.66))
            const total=cardW+(visible-1)*step
            const start=region.x+(region.width-total)/2+cardW/2
            const center=(visible-1)/2
            return Array.from({length:visible},(_,index)=>({
              x:start+index*step,
              y:region.y+region.height*0.55+Math.abs(index-center)*Math.min(3,region.height*0.012),
            }))
          }

          async function clickPhaserBoardTarget(page,label,before){
            const canvas=page.locator('#mx-clean-arena canvas')
            const box=await canvas.boundingBox()
            if(!box)throw new Error('PHASER_CANVAS_NOT_CLICKABLE')
            for(let wait=0;wait<8;wait++){
              const raw=await canvas.getAttribute('data-arena-board-targets')
              const targets=raw?JSON.parse(raw):[]
              if(targets.length){
                const target=targets[0]
                records.push(`[${label}] phaserBoardTarget=${JSON.stringify(target)}`)
                await page.mouse.click(box.x+Number(target.x),box.y+Number(target.y))
                await page.waitForTimeout(1200)
                const after=await snapshot(page)
                const changed=JSON.stringify(before)!==JSON.stringify(after)
                records.push(`[${label}] boardTargetAfter=${JSON.stringify(after)} changed=${changed}`)
                if(!changed)throw new Error('PHASER_BOARD_TARGET_DID_NOT_CHANGE_STATE')
                return after
              }
              await page.waitForTimeout(250)
            }
            throw new Error('PHASER_BOARD_TARGET_NOT_EXPOSED')
          }

          async function proveCanvasSetupAction(page,label,viewport){
            const canvas=page.locator('#mx-clean-arena canvas')
            const box=await canvas.boundingBox()
            if(!box) throw new Error('PHASER_CANVAS_NOT_CLICKABLE')
            const before=await snapshot(page)
            const centers=wideHandCenters(viewport.width,viewport.height,before.hand)
            let choice=null
            for(const center of centers){
              await page.mouse.click(box.x+center.x,box.y+center.y)
              await page.waitForTimeout(250)
              choice=await canvas.getAttribute('data-arena-choice')
              records.push(`[${label}] phaserCardClick x=${center.x.toFixed(1)} y=${center.y.toFixed(1)} choice=${choice}`)
              if(choice==='open') break
            }
            if(choice!=='open') throw new Error('PHASER_CARD_CHOOSER_DID_NOT_OPEN')
            const centersRaw=await canvas.getAttribute('data-arena-choice-actions')
            const actionCenters=centersRaw?JSON.parse(centersRaw):[]
            const chosen=actionCenters[0]
            if(!chosen) throw new Error('PHASER_CHOOSER_ACTIONS_MISSING')
            await page.mouse.click(box.x+Number(chosen.x),box.y+Number(chosen.y))
            await page.waitForTimeout(1300)
            const after=await snapshot(page)
            const changed=JSON.stringify(before)!==JSON.stringify(after)
            records.push(`[${label}] canvasSetupAction before=${JSON.stringify(before)} after=${JSON.stringify(after)} changed=${changed}`)
            if(!changed) throw new Error('PHASER_CARD_ACTION_DID_NOT_REACH_GAME_ENGINE')
          }

          async function advanceSetup(page,label){
            for(let step=0;step<32;step++){
              const before=await snapshot(page)
              records.push(`[${label}] setupStep=${step} state=${JSON.stringify(before)}`)
              if(/BOARD CHOICE REQUIRED/i.test(before.status)){
                await clickPhaserBoardTarget(page,label,before)
                continue
              }
              const setupPrompt=/PILIH KAD (VS|EFFECT)|VS SEDIA|SET VS/i.test(before.prompt)
              const liveEngine=['EFFECT','ATTACK','DRAW','GAME_OVER','TIE_BREAKER'].includes(before.engine)
              if(liveEngine&&!setupPrompt) return before

              const semantic=page.locator('.mx3-local-hand button[data-arena-card-action]:not([disabled])').first()
              if(await semantic.count()){
                const text=((await semantic.textContent())||'').replace(/\s+/g,' ').trim()
                records.push(`[${label}] setupCardAction=${text}`)
                await semantic.evaluate(el=>el.click())
                await page.waitForTimeout(900)
                const after=await snapshot(page)
                if(JSON.stringify(after)!==JSON.stringify(before)) continue
              }

              const next=page.locator('.mx3-phase-prompt button:not([disabled])').filter({hasNotText:/QUIT|AUDIO|SURRENDER|POSISI/i}).first()
              if(await next.count()){
                const text=((await next.textContent())||'').replace(/\s+/g,' ').trim()
                records.push(`[${label}] setupAction=${text}`)
                await next.evaluate(el=>el.click())
                await page.waitForTimeout(1200)
                const after=await snapshot(page)
                if(JSON.stringify(after)!==JSON.stringify(before)) continue
              }

              await page.waitForTimeout(1200)
              const afterWait=await snapshot(page)
              if(JSON.stringify(afterWait)!==JSON.stringify(before)) continue
            }
            throw new Error('SETUP_DID_NOT_REACH_LIVE_PHASE')
          }

          async function proveLiveAction(page,label){
            for(let attempt=0;attempt<8;attempt++){
              const before=await snapshot(page)
              records.push(`[${label}] liveAttempt=${attempt} before=${JSON.stringify(before)}`)
              if(/BOARD CHOICE REQUIRED/i.test(before.status)){
                await clickPhaserBoardTarget(page,label,before)
                return
              }
              const setupPrompt=/PILIH KAD (VS|EFFECT)|VS SEDIA|SET VS/i.test(before.prompt)
              if(setupPrompt){
                await advanceSetup(page,label)
                continue
              }

              const cardAction=page.locator('.mx3-local-hand button[data-arena-card-action]:not([disabled])').first()
              const phaseAction=page.locator('.mx3-phase-prompt button:not([disabled])').filter({hasNotText:/QUIT|AUDIO|SURRENDER|POSISI/i}).first()
              const target=await cardAction.count()?cardAction:phaseAction
              if(await target.count()){
                const text=((await target.textContent())||'').replace(/\s+/g,' ').trim()
                records.push(`[${label}] liveAction=${text}`)
                await target.evaluate(el=>el.click())
                await page.waitForTimeout(1800)
                const after=await snapshot(page)
                const changed=JSON.stringify(before)!==JSON.stringify(after)
                records.push(`[${label}] liveAfter=${JSON.stringify(after)} changed=${changed}`)
                if(changed)return
              }else{
                await page.waitForTimeout(1800)
                const after=await snapshot(page)
                if(JSON.stringify(before)!==JSON.stringify(after))return
              }
            }
            throw new Error('LIVE_GAMEPLAY_ACTION_DID_NOT_CHANGE_STATE')
          }

          async function capture(label,viewport,proveCanvas=false){
            const context=await browser.newContext({viewport,isMobile:viewport.width<600,deviceScaleFactor:1})
            const page=await context.newPage()
            page.on('console',msg=>records.push(`[${label} console ${msg.type()}] ${msg.text()}`))
            page.on('pageerror',err=>records.push(`[${label} pageerror] ${err.message}`))
            page.on('response',res=>{if(res.status()>=400)records.push(`[${label} http ${res.status()}] ${res.url()}`)})
            page.on('requestfailed',req=>records.push(`[${label} requestfailed] ${req.url()} :: ${req.failure()?.errorText||'unknown'}`))
            const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000})
            records.push(`[${label}] status=${response?.status()} viewport=${viewport.width}x${viewport.height}`)
            await enterPractice(page,label)
            await page.waitForSelector('.duel-shell',{timeout:30000,state:'attached'})
            await page.waitForSelector('#mx-clean-arena canvas',{timeout:30000,state:'attached'})
            await page.waitForTimeout(1800)
            if(await page.locator('#mx-clean-arena canvas').count()!==1) throw new Error('PRACTICE_ARENA_NOT_MOUNTED')
            if(proveCanvas) await proveCanvasSetupAction(page,label,viewport)
            const finalState=await advanceSetup(page,label)
            records.push(`[${label}] reachedLiveState=${JSON.stringify(finalState)}`)
            if(proveCanvas) await proveLiveAction(page,label)
            await page.screenshot({path:`${out}/${label}-practice-arena.png`,fullPage:false})
            await context.close()
          }

          let fatal=null
          try{
            await capture('portrait-412x915',{width:412,height:915})
            await capture('landscape-915x412',{width:915,height:412})
            await capture('desktop-1366x768',{width:1366,height:768},true)
            await capture('desktop-1920x1080',{width:1920,height:1080})
          }catch(error){
            fatal=error
            records.push(`[fatal] ${error?.stack||error}`)
          }finally{
            await browser.close()
            fs.writeFileSync(`${out}/report.txt`,records.join('\n\n'))
          }
          if(fatal)throw fatal
          EOF
          node arena-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-visual-qa
          path: visual-qa/
          retention-days: 3
