name: Arena Visual QA

on:
  push:
    branches: [arena-clean-rebuild]
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture actual preview
        env:
          MEGAX_PREVIEW_URL: "https://mega-k3b9m9x7l-nuargita96-2452.vercel.app/?_vercel_share=HelFvNp60n4RtzXzzkvp7TTXPbzeILTq"
        run: |
          cat > arena-qa.mjs <<'EOF'
          import { chromium } from 'playwright'
          import fs from 'node:fs'
          const url=process.env.MEGAX_PREVIEW_URL
          const out='visual-qa'
          fs.mkdirSync(out,{recursive:true})
          const browser=await chromium.launch({headless:true})
          const records=[]
          async function capture(label,viewport){
            const context=await browser.newContext({viewportSize:viewport,isMobile:viewport.width<600,deviceScaleFactor:1})
            const page=await context.newPage()
            page.on('console',msg=>records.push(`[${label} console ${msg.type()}] ${msg.text()}`))
            page.on('pageerror',err=>records.push(`[${label} pageerror] ${err.message}`))
            const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000})
            records.push(`[${label}] status=${response?.status()} url=${page.url()}`)
            await page.waitForTimeout(5000)
            records.push(`[${label}] title=${await page.title()}`)
            records.push(`[${label}] text=${(await page.locator('body').innerText()).slice(0,5000)}`)
            records.push(`[${label}] buttons=${JSON.stringify(await page.locator('button').allTextContents())}`)
            await page.screenshot({path:`${out}/${label}-landing.png`,fullPage:true})

            const clickText=async rx=>{
              const buttons=page.getByRole('button')
              const count=await buttons.count()
              for(let i=0;i<count;i++){
                const b=buttons.nth(i)
                const text=(await b.innerText().catch(()=>''))
                if(rx.test(text)&&await b.isVisible().catch(()=>false)&&await b.isEnabled().catch(()=>false)){
                  records.push(`[${label}] click=${text}`)
                  await b.click()
                  await page.waitForTimeout(2500)
                  return true
                }
              }
              return false
            }

            await clickText(/ENTER|PLAY|FIGHT|START/i)
            await page.screenshot({path:`${out}/${label}-step1.png`,fullPage:true})
            records.push(`[${label}] step1 text=${(await page.locator('body').innerText()).slice(0,5000)}`)
            records.push(`[${label}] step1 buttons=${JSON.stringify(await page.locator('button').allTextContents())}`)

            const practice=await clickText(/PRACTICE|BEGINNER BOT|BOT/i)
            if(practice){
              await page.waitForTimeout(6000)
              await page.screenshot({path:`${out}/${label}-arena.png`,fullPage:true})
              records.push(`[${label}] arena text=${(await page.locator('body').innerText()).slice(0,5000)}`)
              records.push(`[${label}] canvas=${await page.locator('canvas').count()} duelShell=${await page.locator('.duel-shell').count()}`)
            }
            await context.close()
          }
          try{
            await capture('mobile',{width:390,height:844})
            await capture('desktop',{width:1440,height:900})
          }catch(error){
            records.push(`[fatal] ${error?.stack||error}`)
            throw error
          }finally{
            await browser.close()
            fs.writeFileSync(`${out}/report.txt`,records.join('\n\n'))
          }
          EOF
          node arena-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-visual-qa
          path: visual-qa/
          retention-days: 3
