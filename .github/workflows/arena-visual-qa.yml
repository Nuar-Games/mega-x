name: Arena Visual QA

on:
  push:
    branches: [arena-clean-rebuild]
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build current branch
        run: npm run build
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start current branch preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/mega-x-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mega-x-preview.log
          exit 1
      - name: Prove guest Practice and capture arena
        env:
          MEGAX_PREVIEW_URL: "http://127.0.0.1:4173/"
        run: |
          cat > arena-qa.mjs <<'EOF'
          import { chromium } from 'playwright'
          import fs from 'node:fs'
          const url=process.env.MEGAX_PREVIEW_URL
          const out='visual-qa'
          fs.mkdirSync(out,{recursive:true})
          const browser=await chromium.launch({headless:true})
          const records=[]

          async function enterPractice(page,label){
            await page.waitForTimeout(1800)
            const button=page.locator('#mx-main-practice-cta')
            await button.waitFor({state:'visible',timeout:15000})
            const text=(await button.innerText()).replace(/\s+/g,' ').trim()
            const pointerEvents=await button.evaluate(el=>getComputedStyle(el).pointerEvents)
            const box=await button.boundingBox()
            records.push(`[${label}] guestPractice=${text} pointerEvents=${pointerEvents} box=${JSON.stringify(box)}`)
            if(pointerEvents==='none'||!box) throw new Error('GUEST_PRACTICE_NOT_CLICKABLE')
            await button.click()
          }

          async function advanceSetup(page,label){
            for(let step=0;step<12;step++){
              const phase=((await page.locator('.mx3-phase-prompt strong').textContent().catch(()=>''))||'').trim()
              records.push(`[${label}] phase=${phase}`)
              if(/MAIN|ATTACK|EFFECT|DRAW/i.test(phase)) return

              const hand=page.locator('.mx3-local-hand button:not([disabled])')
              if(await hand.count()){
                const first=hand.first()
                if(await first.isVisible().catch(()=>false)){
                  const text=((await first.textContent())||'').replace(/\s+/g,' ').trim()
                  records.push(`[${label}] setupHand=${text.slice(0,80)}`)
                  await first.evaluate(el=>el.click())
                  await page.waitForTimeout(600)
                  continue
                }
              }

              const next=page.locator('.mx3-phase-prompt button:not([disabled]),.mx3-position:not([disabled])').filter({hasNotText:/QUIT|AUDIO|SURRENDER/i}).first()
              if(await next.count() && await next.isVisible().catch(()=>false)){
                const text=((await next.textContent())||'').replace(/\s+/g,' ').trim()
                records.push(`[${label}] setupAction=${text}`)
                await next.evaluate(el=>el.click())
                await page.waitForTimeout(650)
                continue
              }
              break
            }
          }

          async function capture(label,viewport){
            const context=await browser.newContext({viewport,isMobile:viewport.width<600,deviceScaleFactor:1})
            const page=await context.newPage()
            page.on('console',msg=>records.push(`[${label} console ${msg.type()}] ${msg.text()}`))
            page.on('pageerror',err=>records.push(`[${label} pageerror] ${err.message}`))
            page.on('response',res=>{if(res.status()>=400)records.push(`[${label} http ${res.status()}] ${res.url()}`)})
            page.on('requestfailed',req=>records.push(`[${label} requestfailed] ${req.url()} :: ${req.failure()?.errorText||'unknown'}`))
            const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000})
            records.push(`[${label}] status=${response?.status()} viewport=${viewport.width}x${viewport.height}`)
            await enterPractice(page,label)
            await page.waitForSelector('.duel-shell',{timeout:30000,state:'attached'})
            await page.waitForSelector('#mx-clean-arena canvas',{timeout:30000,state:'attached'})
            await page.waitForTimeout(1800)
            const cleanCanvas=await page.locator('#mx-clean-arena canvas').count()
            const duelShell=await page.locator('.duel-shell').count()
            if(cleanCanvas!==1||duelShell<1) throw new Error('PRACTICE_ARENA_NOT_MOUNTED')
            await advanceSetup(page,label)
            await page.waitForTimeout(1400)
            await page.screenshot({path:`${out}/${label}-practice-arena.png`,fullPage:false})
            await context.close()
          }

          let fatal=null
          try{
            await capture('portrait-412x915',{width:412,height:915})
            await capture('landscape-915x412',{width:915,height:412})
            await capture('desktop-1366x768',{width:1366,height:768})
            await capture('desktop-1920x1080',{width:1920,height:1080})
          }catch(error){
            fatal=error
            records.push(`[fatal] ${error?.stack||error}`)
          }finally{
            await browser.close()
            fs.writeFileSync(`${out}/report.txt`,records.join('\n\n'))
          }
          if(fatal)throw fatal
          EOF
          node arena-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-visual-qa
          path: visual-qa/
          retention-days: 3
