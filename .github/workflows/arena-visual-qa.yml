name: Arena Visual QA

on:
  push:
    branches: [arena-clean-rebuild]
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture actual Practice arena
        env:
          MEGAX_PREVIEW_URL: "https://mega-hkxw255kh-nuargita96-2452.vercel.app/?_vercel_share=qgNBw4r3DV6PSu9YoFLsvdrCK1WWA9BF"
        run: |
          cat > arena-qa.mjs <<'EOF'
          import { chromium } from 'playwright'
          import fs from 'node:fs'
          const url=process.env.MEGAX_PREVIEW_URL
          const out='visual-qa'
          fs.mkdirSync(out,{recursive:true})
          const browser=await chromium.launch({headless:true})
          const records=[]

          async function clickMatching(page,rx,{visible=true}={}){
            const buttons=page.locator(visible?'button:visible':'button')
            const count=await buttons.count()
            for(let i=0;i<count;i++){
              const button=buttons.nth(i)
              const text=(await button.innerText().catch(()=>'' )).replace(/\s+/g,' ').trim()
              if(rx.test(text)&&await button.isEnabled().catch(()=>false)){
                await button.click({force:true})
                return text
              }
            }
            return null
          }

          async function enterPractice(page,label){
            await page.waitForTimeout(2200)
            let landing=await clickMatching(page,/MAIN SEKARANG/i)
            if(!landing)landing=await clickMatching(page,/PLAY NOW/i)
            records.push(`[${label}] landingClick=${landing||'none'}`)
            await page.waitForTimeout(1400)
            const allButtons=await page.locator('button').allInnerTexts().catch(()=>[])
            records.push(`[${label}] allButtons=${allButtons.join(' | ')}`)
            const practice=await clickMatching(page,/PRACTICE/i,{visible:false})
            if(practice){records.push(`[${label}] practiceClick=${practice}`);return}
            await page.evaluate(()=>{
              document.documentElement.classList.add('mx-practice-active')
              window.dispatchEvent(new CustomEvent('mega-x:start-practice-match'))
            })
            records.push(`[${label}] dispatched=mega-x:start-practice-match`)
          }

          async function capture(label,viewport){
            const context=await browser.newContext({viewport,isMobile:viewport.width<600,deviceScaleFactor:1})
            const page=await context.newPage()
            page.on('console',msg=>records.push(`[${label} console ${msg.type()}] ${msg.text()}`))
            page.on('pageerror',err=>records.push(`[${label} pageerror] ${err.message}`))
            const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000})
            records.push(`[${label}] status=${response?.status()} viewport=${viewport.width}x${viewport.height}`)
            await enterPractice(page,label)
            await page.waitForSelector('.duel-shell',{timeout:30000,state:'attached'})
            await page.waitForSelector('#mx-clean-arena canvas',{timeout:30000,state:'attached'})
            await page.waitForTimeout(3500)
            records.push(`[${label}] cleanCanvas=${await page.locator('#mx-clean-arena canvas').count()} duelShell=${await page.locator('.duel-shell').count()}`)
            await page.screenshot({path:`${out}/${label}-practice-arena.png`,fullPage:false})
            await context.close()
          }

          try{
            await capture('portrait-412x915',{width:412,height:915})
            await capture('landscape-915x412',{width:915,height:412})
            await capture('desktop-1366x768',{width:1366,height:768})
            await capture('desktop-1920x1080',{width:1920,height:1080})
          }catch(error){
            records.push(`[fatal] ${error?.stack||error}`)
            throw error
          }finally{
            await browser.close()
            const report=records.join('\n\n')
            console.log(report)
            fs.writeFileSync(`${out}/report.txt`,report)
          }
          EOF
          node arena-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-visual-qa
          path: visual-qa/
          retention-days: 3
