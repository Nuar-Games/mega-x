name: Materialize guest lobby VS fix

on:
  push:
    branches: [arena-clean-rebuild]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate authoritative source
        run: node scripts/build-clean.mjs --prepare-only
      - name: Commit generated source if changed
        run: |
          paths=(src/App.tsx src/onlineAuth.ts src/index.css src/arena-blueprint.fragment)
          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo 'NO_GENERATED_DRIFT'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          git commit -m 'chore: materialize guest lobby and VS race fix'
          git push origin HEAD:arena-clean-rebuild
