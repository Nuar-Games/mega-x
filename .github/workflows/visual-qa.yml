name: visual-qa

on:
  push:
    branches:
      - phaser-arena-rebuild
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/mega-preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mega-preview.log
          exit 1
      - name: Capture real arena viewports
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright'
          import fs from 'node:fs'
          fs.mkdirSync('visual-qa', { recursive: true })
          const browser = await chromium.launch({ headless: true })
          const cases = [
            ['mobile-portrait', 412, 915],
            ['mobile-landscape', 915, 412],
            ['laptop-1366x768', 1366, 768],
            ['desktop-1920x1080', 1920, 1080],
          ]
          for (const [name, width, height] of cases) {
            const page = await browser.newPage({ viewport: { width, height } })
            await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' })

            const practice = page.getByRole('button', { name: /practice|latihan/i }).first()
            if (await practice.count()) {
              await practice.click({ timeout: 3000 })
              await page.waitForTimeout(1500)
            }

            const arena = page.locator('.duel-shell').first()
            if (!(await arena.count())) {
              await page.screenshot({ path: `visual-qa/${name}-QA-FAILED-no-arena.png`, fullPage: true })
              throw new Error(`VISUAL QA FAILED: ${name} never reached the match arena. A landing-page screenshot is not arena QA.`)
            }

            const box = await arena.boundingBox()
            const canvas = page.locator('.mx3-canvas').first()
            const canvasBox = await canvas.count() ? await canvas.boundingBox() : null
            await page.screenshot({ path: `visual-qa/${name}-arena.png`, fullPage: true })
            fs.writeFileSync(`visual-qa/${name}-geometry.json`, JSON.stringify({ viewport:{width,height}, shell:box, canvas:canvasBox }, null, 2))

            if (!box || box.width < width * 0.95 || box.height < height * 0.95) {
              throw new Error(`VISUAL QA FAILED: ${name} arena does not own the viewport: ${JSON.stringify(box)}`)
            }
            await page.close()
          }
          await browser.close()
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mega-x-visual-qa
          path: visual-qa
          if-no-files-found: error
