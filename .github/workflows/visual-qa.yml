name: visual-qa

on:
  push:
    branches:
      - phaser-arena-rebuild
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/mega-preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mega-preview.log
          exit 1
      - name: Capture real arena viewports
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright'
          import fs from 'node:fs'
          fs.mkdirSync('visual-qa', { recursive: true })
          const browser = await chromium.launch({ headless: true })
          const cases = [
            ['mobile-portrait', 412, 915],
            ['mobile-landscape', 915, 412],
            ['laptop-1366x768', 1366, 768],
            ['desktop-1920x1080', 1920, 1080],
          ]

          async function clickCandidate(page, pattern) {
            const button = page.getByRole('button', { name: pattern }).first()
            if (!(await button.count())) return false
            if (!(await button.isVisible().catch(() => false))) return false
            await button.click({ timeout: 3000 })
            await page.waitForTimeout(700)
            return true
          }

          async function reachArena(page, name) {
            if (await page.locator('.duel-shell').count()) return true
            await clickCandidate(page, /main sekarang|play now|mula sekarang|play/i)
            if (await page.locator('.duel-shell').count()) return true
            await clickCandidate(page, /guest|tetamu|continue as guest|main tanpa akaun/i)
            if (await page.locator('.duel-shell').count()) return true
            await clickCandidate(page, /practice|latihan/i)
            if (await page.locator('.duel-shell').count()) return true
            await clickCandidate(page, /beginner bot|bot/i)
            if (await page.locator('.duel-shell').count()) return true
            await page.screenshot({ path: `visual-qa/${name}-QA-BLOCKER.png`, fullPage: true })
            fs.writeFileSync(`visual-qa/${name}-blocker.txt`, await page.locator('body').innerText())
            return false
          }

          for (const [name, width, height] of cases) {
            const page = await browser.newPage({ viewport: { width, height } })
            await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' })
            const reached = await reachArena(page, name)
            if (!reached) {
              throw new Error(`VISUAL QA FAILED: ${name} could not reach the match arena through the player entry flow.`)
            }

            await page.waitForTimeout(1000)
            const arena = page.locator('.duel-shell').first()
            const box = await arena.boundingBox()
            const canvas = page.locator('.mx3-canvas').first()
            const canvasBox = await canvas.count() ? await canvas.boundingBox() : null
            await page.screenshot({ path: `visual-qa/${name}-arena.png`, fullPage: true })
            fs.writeFileSync(`visual-qa/${name}-geometry.json`, JSON.stringify({ viewport:{width,height}, shell:box, canvas:canvasBox }, null, 2))

            if (!box || box.width < width * 0.95 || box.height < height * 0.95) {
              throw new Error(`VISUAL QA FAILED: ${name} arena does not own the viewport: ${JSON.stringify(box)}`)
            }
            await page.close()
          }
          await browser.close()
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mega-x-visual-qa
          path: visual-qa
          if-no-files-found: error
