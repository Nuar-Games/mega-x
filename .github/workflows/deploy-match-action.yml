name: Deploy match-action

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which Supabase project to deploy match-action to
        required: true
        type: choice
        options:
          - test
          - production

permissions:
  contents: read

concurrency:
  group: deploy-match-action-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy-test:
    if: ${{ inputs.target == 'test' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zuxclpndoatsuxvctrve
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy match-action to TEST
        run: supabase functions deploy match-action --project-ref "$PROJECT_REF" --use-api
      - name: List deployed functions
        run: supabase functions list --project-ref "$PROJECT_REF"

  deploy-production:
    if: ${{ inputs.target == 'production' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mmtorfzxnidsczcdygbp
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy match-action to PRODUCTION
        run: supabase functions deploy match-action --project-ref "$PROJECT_REF" --use-api
      - name: List deployed functions
        run: supabase functions list --project-ref "$PROJECT_REF"
