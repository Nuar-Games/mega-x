name: One-off — commit verified generated snapshots

on:
  workflow_dispatch:
  push:
    branches: [arena-clean-rebuild]
    paths:
      - '.github/workflows/commit-generated-source-once.yml'

permissions:
  contents: write

jobs:
  commit-generated-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena-clean-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Reset working tree
        run: git checkout -- .

      - name: Regenerate authoritative source
        run: node scripts/build-clean.mjs --prepare-only

      - name: Verify full regression suite
        run: npm test

      - name: Verify typecheck
        run: npx tsc --noEmit

      - name: Commit verified generated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/onlineAuth.ts src/arena-blueprint.fragment
          echo '===== GENERATED SNAPSHOT DIFF ====='
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'Generated snapshots already in sync.'
            exit 0
          fi
          git commit -m "chore: commit authoritative generated source snapshots"
          git push origin HEAD:arena-clean-rebuild
