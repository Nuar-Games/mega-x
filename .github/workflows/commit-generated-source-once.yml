name: One-off — diagnose generated source snapshot

on:
  workflow_dispatch:
  push:
    branches: [arena-clean-rebuild]
    paths:
      - '.github/workflows/commit-generated-source-once.yml'

permissions:
  contents: read

jobs:
  diagnose-generated-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena-clean-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Status after dependency install
        run: |
          echo '===== STATUS AFTER NPM INSTALL ====='
          git status --short

      - name: Regenerate authoritative source once
        run: node scripts/build-clean.mjs --prepare-only

      - name: Show complete materialization delta
        run: |
          echo '===== STATUS AFTER PREPARE ====='
          git status --short
          echo '===== TRACKED DIFF NAME/STATUS ====='
          git diff --name-status
          echo '===== TRACKED DIFF STAT ====='
          git diff --stat
          echo '===== SELF-PATCH DIFF ====='
          git diff -- scripts/patch-arena-ownership-choice.mjs
          echo '===== SOURCE/TEST DIFFS ====='
          git diff -- src/VsIntro.css src/VsIntro.tsx src/VsIntroHype.css src/arena-stage.css src/arena-stage.ts src/arena-usability.css src/audio.ts src/lobby-ui.ts src/main.tsx src/practice-match.ts supabase/functions/match-action/engine.ts tests/practice_real_exhaustion_lifecycle_regression.mjs
          echo '===== UNTRACKED FILES ====='
          git ls-files --others --exclude-standard

      - name: Stop without committing
        run: |
          echo 'DIAGNOSTIC_ONLY_NO_COMMIT'
          exit 0
