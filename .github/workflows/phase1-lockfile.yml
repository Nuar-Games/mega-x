name: Phase 1 lockfile materialization

on:
  push:
    branches: [phase1-freeze-generated-source]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create reproducible npm lockfile
        run: npm install --package-lock-only
      - name: Commit lockfile and remove this one-time workflow
        run: |
          rm -f .github/workflows/phase1-lockfile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/phase1-lockfile.yml
          git commit -m 'chore: add npm lockfile for reproducible installs'
          git push origin HEAD:phase1-freeze-generated-source
