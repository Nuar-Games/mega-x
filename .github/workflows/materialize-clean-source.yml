name: Phase 1 one-time source materialization

on:
  push:
    branches: [phase1-freeze-generated-source]

permissions:
  contents: write

jobs:
  materialize-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Materialize current generated source exactly once
        run: node scripts/build-clean.mjs --prepare-only
      - name: Commit every materialized source change
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo 'MATERIALIZED_SOURCE_ALREADY_COMMITTED'
            exit 0
          fi
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: materialize generated source before removing codegen'
          git push origin HEAD:phase1-freeze-generated-source
