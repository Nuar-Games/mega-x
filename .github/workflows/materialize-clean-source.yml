name: Verify source

on:
  push:
    branches: [arena-total-rewrite, phase1-freeze-generated-source]
  pull_request:
    branches: [arena-total-rewrite]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      MEGA_X_E2E_P1_EMAIL: ${{ secrets.MEGA_X_E2E_P1_EMAIL }}
      MEGA_X_E2E_P1_PASSWORD: ${{ secrets.MEGA_X_E2E_P1_PASSWORD }}
      MEGA_X_E2E_P1_HANDLE: ${{ secrets.MEGA_X_E2E_P1_HANDLE }}
      MEGA_X_E2E_P2_EMAIL: ${{ secrets.MEGA_X_E2E_P2_EMAIL }}
      MEGA_X_E2E_P2_PASSWORD: ${{ secrets.MEGA_X_E2E_P2_PASSWORD }}
      MEGA_X_E2E_P2_HANDLE: ${{ secrets.MEGA_X_E2E_P2_HANDLE }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_ENV: ${{ secrets.VITE_SUPABASE_ENV }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build and regression tests
        run: npm run build
      - name: Verify install and build leave the checkout clean
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo 'Install or build changed the checkout:'
            git status --short
            git diff
            exit 1
          fi
          echo 'INSTALL_AND_BUILD_LEFT_CHECKOUT_CLEAN'
      - name: E2E typecheck
        run: npx tsc -p tsconfig.e2e.json --noEmit
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Practice browser E2E
        run: npx playwright test tests-e2e/arena_3d_set_vs_real_pointer.spec.ts
      - name: Online two-player E2E
        if: ${{ env.MEGA_X_E2E_P1_EMAIL != '' && env.MEGA_X_E2E_P1_PASSWORD != '' && env.MEGA_X_E2E_P1_HANDLE != '' && env.MEGA_X_E2E_P2_EMAIL != '' && env.MEGA_X_E2E_P2_PASSWORD != '' && env.MEGA_X_E2E_P2_HANDLE != '' }}
        run: npx playwright test tests-e2e/arena_online_two_player.spec.ts
      - name: Record skipped online E2E
        if: ${{ env.MEGA_X_E2E_P1_EMAIL == '' || env.MEGA_X_E2E_P1_PASSWORD == '' || env.MEGA_X_E2E_P1_HANDLE == '' || env.MEGA_X_E2E_P2_EMAIL == '' || env.MEGA_X_E2E_P2_PASSWORD == '' || env.MEGA_X_E2E_P2_HANDLE == '' }}
        run: echo 'ONLINE_E2E_SKIPPED_FIXED_TEST_ACCOUNTS_NOT_CONFIGURED'
