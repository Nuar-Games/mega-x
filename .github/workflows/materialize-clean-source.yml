name: Verify generated clean source

on:
  push:
    branches: [arena-clean-rebuild, arena-total-rewrite]
  pull_request:
    branches: [arena-clean-rebuild, arena-total-rewrite]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-generated-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Guard arena-next from patch-chain codegen
        run: |
          if grep -R --line-number --include='patch-*.mjs' --include='build-clean.mjs' 'arena-next' scripts; then
            echo 'arena-next must remain normal hand-authored source and may not be referenced by build-clean or patch scripts.'
            exit 1
          fi
          echo 'ARENA_NEXT_PATCH_CHAIN_GUARD_OK'
      - name: Regenerate authoritative source once
        run: node scripts/build-clean.mjs --prepare-only
      - name: Auto-commit generated source on rewrite branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena-total-rewrite'
        run: |
          paths=(src/App.tsx src/onlineAuth.ts src/index.css src/arena-blueprint.fragment)
          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo 'GENERATED_SOURCE_IN_SYNC'
            exit 0
          fi

          echo 'Generated source drift detected; committing deterministic outputs.'
          git status --short -- "${paths[@]}"
          git diff -- "${paths[@]}" || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          git commit -m 'chore: regenerate authoritative generated source'
          git push origin HEAD:arena-total-rewrite
      - name: Fail if generated source is not committed exactly
        run: |
          paths=(src/App.tsx src/onlineAuth.ts src/index.css src/arena-blueprint.fragment)
          if [[ -n "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo 'Generated source drift remains after regeneration.'
            git status --short -- "${paths[@]}"
            git diff -- "${paths[@]}" || true
            exit 1
          fi
          echo 'GENERATED_SOURCE_IN_SYNC'
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Arena-next regression tests
        run: |
          node tests/arena_next_contract_regression.mjs
          node tests/arena_next_event_pipeline_regression.mjs
          node tests/arena_next_prototype_regression.mjs
          node tests/arena_next_live_match_regression.mjs
          node tests/arena_next_pipeline_guard_regression.mjs
          node tests/arena_next_command_surface_regression.mjs
