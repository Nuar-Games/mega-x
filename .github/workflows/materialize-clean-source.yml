name: Verify source

on:
  push:
    branches: [arena-total-rewrite, phase1-freeze-generated-source]
  pull_request:
    branches: [arena-total-rewrite]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build and regression tests
        run: npm run build
      - name: E2E typecheck
        run: npx tsc -p tsconfig.e2e.json --noEmit
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e
      - name: Verify build did not modify tracked source
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo 'Build changed tracked files:'
            git status --short --untracked-files=no
            git diff
            exit 1
          fi
          echo 'BUILD_LEFT_TRACKED_SOURCE_CLEAN'
