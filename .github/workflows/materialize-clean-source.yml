name: Verify generated clean source

on:
  push:
    branches: [arena-clean-rebuild]
  pull_request:
    branches: [arena-clean-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-generated-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Regenerate authoritative source in the documented order
        run: |
          # ORDER IS AUTHORITATIVE. Patch scripts depend on the output of earlier steps.
          node scripts/recover-app.mjs
          node scripts/diagnose-discard-markup.mjs
          node scripts/diagnose-leaderboard-markup.mjs
          node scripts/inspect-auth-app.mjs
          node scripts/recover-css.mjs
          node scripts/recover-cards.mjs
          node scripts/recover-landing-assets.mjs
          node scripts/patch-auth-key.mjs
          node scripts/patch-auth-runtime.mjs
          node scripts/patch-online-feel.mjs
          node scripts/patch-coin-toss-presentation.mjs
          node scripts/patch-network-load.mjs
          node scripts/patch-realtime-load.mjs
          node scripts/patch-critical-gameplay.mjs
          node scripts/patch-polish.mjs
          node scripts/patch-resilience.mjs
          node scripts/patch-arena-flow.mjs
          node scripts/patch-user-feedback.mjs
          node scripts/patch-first-place-glow.mjs
          node scripts/patch-attack-block-feedback.mjs
          node scripts/patch-mobile-lobby.mjs
          node scripts/patch-arena-mobile-audit.mjs
          node scripts/patch-gameplay-flow-regressions.mjs
          node scripts/patch-vs-card-id-anchors.mjs
          node scripts/patch-arena-blueprint-structure.mjs
          node scripts/patch-tie-breaker-choice.mjs
          node scripts/patch-arena-usability.mjs
          node scripts/patch-vs-intro-flow.mjs
          node scripts/patch-audio-mobile.mjs
          node scripts/patch-production-jank-hotfix.mjs
          node scripts/patch-leaderboard-spacing.mjs
          node scripts/patch-vs-intro-consistency.mjs
          node scripts/hotfix-discard-build.mjs
          node scripts/patch-arena-ownership-choice.mjs
          node scripts/patch-hidden-choice-3d-bridge.mjs
          node scripts/patch-self-discard-3d-bridge.mjs
          node scripts/patch-spudur-atk.mjs
          node scripts/patch-discard-direct-image.mjs
          node scripts/patch-mobile-wake-lock.mjs
          node scripts/patch-final-arena-touchup.mjs
          node scripts/patch-practice-effect-control.mjs
          node scripts/diagnose-final-discard-css.mjs
          node scripts/diagnose-lobby-presence.mjs
          node scripts/diagnose-final-roster.mjs
          node scripts/patch-practice-dead-turn.mjs
          node scripts/patch-practice-deck-exhaustion.mjs
          node scripts/patch-practice-quit.mjs
          node scripts/patch-admin-controls.mjs
      - name: Mark generated text files
        run: |
          python - <<'PY'
          from pathlib import Path

          headers = {
              Path('src/App.tsx'): '// GENERATED FILE — produced by .github/workflows/materialize-clean-source.yml; do not hand-edit.\n',
              Path('src/onlineAuth.ts'): '// GENERATED FILE — produced by .github/workflows/materialize-clean-source.yml; do not hand-edit.\n',
              Path('src/index.css'): '/* GENERATED FILE — produced by .github/workflows/materialize-clean-source.yml; do not hand-edit. */\n',
              Path('src/arena-blueprint.fragment'): '<!-- GENERATED FILE — produced by .github/workflows/materialize-clean-source.yml; do not hand-edit. -->\n',
          }
          for path, header in headers.items():
              if not path.exists():
                  raise SystemExit(f'expected generated file missing: {path}')
              text = path.read_text()
              if not text.startswith(header):
                  path.write_text(header + text)
          PY
      - name: Fail if generated source is not committed exactly
        run: |
          paths=(src/App.tsx src/onlineAuth.ts src/index.css src/arena-blueprint.fragment public/cards public/ui)
          if [[ -n "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo 'Generated source drift detected. Regenerate locally and commit the resulting files; CI will never push back to this branch.'
            git status --short -- "${paths[@]}"
            git diff -- "${paths[@]}" || true
            exit 1
          fi
          echo 'GENERATED_SOURCE_IN_SYNC'
