name: Commit Generated App.tsx Snapshot

on:
  push:
    branches: [arena-clean-rebuild]
    paths:
      - '.github/workflows/commit-app-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-app-tsx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout arena-clean-rebuild
        uses: actions/checkout@v4
        with:
          ref: arena-clean-rebuild
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Reset working tree
        run: git checkout -- .

      - name: Regenerate src/App.tsx via authoritative prepare chain
        run: node scripts/build-clean.mjs --prepare-only

      - name: Show git status (sanity check)
        run: git status --porcelain

      - name: Require App.tsx to be the only generated-source drift
        run: |
          paths=(src/App.tsx src/onlineAuth.ts src/index.css src/arena-blueprint.fragment public/cards public/ui)
          unexpected="$(git status --porcelain -- "${paths[@]}" | grep -vE '^\?\? src/App\.tsx$|^ M src/App\.tsx$|^M  src/App\.tsx$|^A  src/App\.tsx$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected generated-source drift detected:'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit and push if App.tsx changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "No changes to src/App.tsx — nothing to commit."
            exit 0
          fi
          git commit -m "chore: commit authoritative generated src/App.tsx snapshot"
          git push origin HEAD:arena-clean-rebuild

      - name: Run full regression suite
        run: npm test
