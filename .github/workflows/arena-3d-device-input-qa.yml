name: Arena 3D Device Input QA

on:
  push:
    branches: [arena-clean-rebuild]
  workflow_dispatch:

jobs:
  device-input:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run regression tests
        run: npm test
      - name: Build current branch
        run: npm run build
      - name: Install browser engines
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/mega-x-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mega-x-preview.log
          exit 1
      - name: Verify desktop 3D hand mesh with mouse input
        env:
          MEGAX_PREVIEW_URL: http://127.0.0.1:4173/
        run: |
          cat > device-input-qa.mjs <<'EOF'
          import { chromium } from 'playwright'
          const base=process.env.MEGAX_PREVIEW_URL
          const url=`${base}?arena=3d`
          const browser=await chromium.launch({headless:true})
          const context=await browser.newContext({viewport:{width:1366,height:768},hasTouch:false,isMobile:false,deviceScaleFactor:1,reducedMotion:'reduce'})
          const page=await context.newPage()
          page.on('console',m=>{const t=m.text(); if(t.startsWith('[MX_QA]')) console.log(`[desktop] ${t}`)})
          const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000})
          if(response?.status()!==200)throw new Error(`HTTP_${response?.status()}`)
          await page.locator('#mx-main-practice-cta').waitFor({state:'visible',timeout:15000})
          await page.locator('#mx-main-practice-cta').click()
          await page.waitForSelector('[data-arena-3d-root="true"]',{timeout:30000})
          await page.waitForSelector('.mx3d-canvas canvas',{state:'visible',timeout:30000})
          await page.waitForTimeout(1200)
          const root=page.locator('[data-arena-3d-root="true"]')
          console.log(`DESKTOP_TOUCH_FLAG=${await root.getAttribute('data-touch-capable')}`)
          console.log(`DESKTOP_DOM_HAND_VISIBLE=${await page.locator('.mx3d-mobile-hand').isVisible().catch(()=>false)}`)
          const canvas=page.locator('.mx3d-canvas canvas')
          const box=await canvas.boundingBox()
          if(!box)throw new Error('CANVAS_BOX_MISSING')
          const read=()=>page.evaluate(()=>JSON.stringify({
            prompt:document.querySelector('.mx3d-prompt')?.textContent||'',
            status:document.querySelector('.mx3d-status')?.textContent||'',
            phase:document.querySelector('.mx3-canvas')?.getAttribute('data-arena-phase')||'',
            chooser:document.querySelector('.mx3d-chooser')?.textContent||''
          }))
          const initial=await read()
          console.log(`INITIAL=${initial}`)
          let hit=null
          const ys=[0.58,0.64,0.70,0.76,0.82,0.88]
          const xs=[0.20,0.28,0.36,0.44,0.50,0.56,0.64,0.72,0.80]
          for(const yf of ys){
            for(const xf of xs){
              const x=box.x+box.width*xf
              const y=box.y+box.height*yf
              await page.mouse.click(x,y)
              await page.waitForTimeout(180)
              const now=await read()
              if(now!==initial){
                hit={x,y,xf,yf,now}
                console.log(`MOUSE_HIT x=${x.toFixed(1)} y=${y.toFixed(1)} xf=${xf} yf=${yf} state=${now}`)
                break
              }
            }
            if(hit)break
          }
          if(!hit)throw new Error('DESKTOP_MOUSE_MESH_NO_STATE_CHANGE')
          const chooser=page.locator('.mx3d-chooser')
          if(await chooser.count()){
            console.log(`CHOOSER_TEXT=${(await chooser.textContent())?.trim()||''}`)
            const choice=page.locator('.mx3d-choice:not([disabled])').filter({hasNotText:/QUIT|SURRENDER|AUDIO/i}).first()
            if(await choice.count()){
              console.log(`CHOOSER_ACTION=${((await choice.textContent())||'').trim()}`)
              await choice.click()
              await page.waitForTimeout(500)
              console.log(`AFTER_CHOICE=${await read()}`)
            }
          }
          console.log('PASS desktop-real-mouse-3d-hand')
          await browser.close()
          EOF
          node device-input-qa.mjs
