<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mega X Arena Live Bridge</title>
  <style>
    html,body,#arena-next-live{width:100%;height:100%;margin:0;overflow:hidden;background:#111317}
    body{touch-action:none;user-select:none;font-family:Arial,sans-serif}
    canvas{display:block;width:100%;height:100%}
    #arena-next-live-status{position:fixed;left:12px;top:12px;z-index:20;padding:8px 10px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.18);color:#fff;font:12px/1.3 Arial,sans-serif;pointer-events:none}
    #arena-next-live-controls{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:21;display:flex;gap:6px;max-width:92vw;overflow-x:auto;padding:8px;background:rgba(0,0,0,.76);border:1px solid rgba(255,255,255,.18)}
    #arena-next-live-controls:empty{display:none}
    #arena-next-live-controls button{white-space:nowrap;border:1px solid rgba(255,255,255,.35);background:#222832;color:#fff;padding:8px 10px;font-weight:700;cursor:pointer}
    #arena-next-live-controls button:disabled{opacity:.45;cursor:default}
  </style>
</head>
<body>
  <div id="arena-next-live"></div>
  <div id="arena-next-live-status">CONNECTING TO ACTIVE MATCH…</div>
  <div id="arena-next-live-controls"></div>
  <script type="module" src="/src/game/arena-next/prototype/live-main.ts"></script>
</body>
</html>
