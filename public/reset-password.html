<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#05070b" />
  <title>MEGA X · Reset Password</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f6f7fb;background:#05070b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#182238 0,#080c14 42%,#030508 100%)}
    main{width:min(430px,100%);padding:30px;border:1px solid rgba(255,213,106,.32);background:rgba(7,10,17,.94);box-shadow:0 30px 90px rgba(0,0,0,.65)}
    img{display:block;width:min(260px,75%);height:auto;margin:0 auto 26px}h1{font-size:20px;letter-spacing:.15em;text-align:center;margin:0 0 8px}p{color:rgba(255,255,255,.68);font-size:13px;line-height:1.55;text-align:center;margin:0 0 22px}
    label{display:block;font-size:11px;letter-spacing:.11em;margin:14px 0 7px;color:rgba(255,255,255,.72)}input{width:100%;padding:13px 14px;border:1px solid rgba(255,255,255,.18);background:#0a0f19;color:#fff;font:inherit;outline:none}input:focus{border-color:rgba(255,213,106,.72)}button,a.action{display:block;width:100%;margin-top:18px;padding:13px 16px;border:1px solid rgba(255,213,106,.56);background:#171407;color:#ffe49a;font-weight:800;letter-spacing:.1em;text-align:center;text-decoration:none;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#status{min-height:21px;margin-top:16px;color:#ffe49a}a.action{display:none}
  </style>
</head>
<body>
  <main>
    <img src="/ui/landing/logo.avif" alt="MEGA X" />
    <h1>NEW PASSWORD</h1>
    <p id="intro">Use the recovery link from your email to set a new password.</p>
    <form id="reset-form">
      <label for="password">NEW PASSWORD</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required />
      <label for="confirm">CONFIRM NEW PASSWORD</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="8" required />
      <button id="submit" type="submit">UPDATE PASSWORD</button>
    </form>
    <p id="status" role="status"></p>
    <a id="return" class="action" href="/">RETURN TO MEGA X</a>
  </main>
  <script>
    (() => {
      const SUPABASE_URL = 'https://mmtorfzxnidsczcdygbp.supabase.co'
      const SUPABASE_KEY = 'sb_publishable_fXF7LXgKXeH4p5_Bwai0nQ_d-NWdOk_'
      // Supabase recovery links must contain type=recovery and an access token.
      const params = new URLSearchParams(location.hash.slice(1))
      const recoveryType = params.get('type')
      const accessToken = params.get('access_token')
      const form = document.getElementById('reset-form')
      const status = document.getElementById('status')
      const submit = document.getElementById('submit')
      const returnLink = document.getElementById('return')

      if (recoveryType !== 'recovery' || !accessToken) {
        form.hidden = true
        status.textContent = 'THIS PASSWORD RECOVERY LINK IS INVALID OR HAS EXPIRED.'
        returnLink.style.display = 'block'
        return
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        const password = document.getElementById('password').value
        const confirm = document.getElementById('confirm').value
        if (password.length < 8) { status.textContent = 'PASSWORD MUST BE AT LEAST 8 CHARACTERS.'; return }
        if (password !== confirm) { status.textContent = 'PASSWORDS DO NOT MATCH.'; return }
        submit.disabled = true
        status.textContent = 'UPDATING PASSWORD…'
        try {
          const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
            method: 'PUT',
            headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ password }),
          })
          const payload = await response.json().catch(() => ({}))
          if (!response.ok) throw new Error(payload?.message || payload?.msg || payload?.error_description || payload?.error || 'PASSWORD UPDATE FAILED')
          history.replaceState(null, '', location.pathname)
          form.hidden = true
          status.textContent = 'PASSWORD UPDATED.'
          returnLink.style.display = 'block'
        } catch (error) {
          status.textContent = error instanceof Error ? error.message : 'PASSWORD UPDATE FAILED'
          submit.disabled = false
        }
      })
    })()
  </script>
</body>
</html>
